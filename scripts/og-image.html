<html>

<style>
  @font-face { font-family: F; src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2'); font-weight: 100 900; }

  * { margin: 0; box-sizing: border-box; }

  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(236,230,218,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(236,230,218,.07) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 55% 75% at 78% 50%, #000, transparent 75%); }

  .eyebrow b { font-weight: 400; color: #e8b866; }
  .eyebrow i { width: 36px; height: 1px; background: #d6a24e; display: block; }

  .layer::before { content: ''; position: absolute; left: -36px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; border: 1.5px solid #7f9db8; background: #0b0e13; }

  .layer.lit::before { background: #d6a24e; border-color: #d6a24e; }

    <div class="layer">Controllers <span>HTTP</span></div>
