<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0e13" />
    <title>Page not found — William Marietta</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #0b0e13;
        background-image:
          linear-gradient(rgba(236, 230, 218, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(236, 230, 218, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        color: #ece6da;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
      }
      .code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #d6a24e;
      }
      h1 {
        margin-top: 1.25rem;
        font-family: 'Iowan Old Style', Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      h1 em {
        color: #e8b866;
      }
      p {
        margin-top: 1rem;
        color: #c2bcb0;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        background: #ece6da;
        color: #0b0e13;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #e8b866;
      }
      a:focus-visible {
        outline: 2px solid #d6a24e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page <em>doesn’t exist.</em></h1>
      <p>The portfolio is a single page, so everything lives at the home address.</p>
      <a href="/">Back to the portfolio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
